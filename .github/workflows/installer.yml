name: Installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check firmware planning, recovery and host guards without hardware
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Package standalone launchers
        run: python tools/package_release.py
      - name: Check extracted macOS launcher without device access
        if: runner.os == 'macOS'
        run: |
          ditto -x -k build/release/Install-iPod-USB-C-Mac.zip build/extracted-mac
          test -x build/extracted-mac/Install-iPod-USB-C.command
          build/extracted-mac/Install-iPod-USB-C.command --self-test
          bash build/release/Install-Optional-Screen-Boost.command --self-test
          ditto -x -k build/release/Install-Optional-Smooth-Menus-Mac.zip build/extracted-smooth
          test -x build/extracted-smooth/Install-Optional-Smooth-Menus.command
          build/extracted-smooth/Install-Optional-Smooth-Menus.command --self-test
          ditto -x -k build/release/Install-Faster-Menus-Mac.zip build/extracted-fast
          test -x build/extracted-fast/Install-Faster-Menus.command
          build/extracted-fast/Install-Faster-Menus.command --self-test
          ditto -x -k build/release/Install-Drawing-Optimization-Preview-Mac.zip build/extracted-drawing
          test -x build/extracted-drawing/Install-Drawing-Optimization-Preview.command
          build/extracted-drawing/Install-Drawing-Optimization-Preview.command --self-test
          bash build/release/Restore-Previous-Drawing-Preview.command --self-test
      - name: Check extracted Windows launcher without device access
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build\release\Install-iPod-USB-C.cmd --self-test
          if errorlevel 1 exit /b 1
          call build\release\Install-Optional-Screen-Boost.cmd --self-test
          if errorlevel 1 exit /b 1
          call build\release\Install-Optional-Smooth-Menus.cmd --self-test
          if errorlevel 1 exit /b 1
          call build\release\Install-Faster-Menus.cmd --self-test
          if errorlevel 1 exit /b 1
          call build\release\Install-Drawing-Optimization-Preview.cmd --self-test
          if errorlevel 1 exit /b 1
          call build\release\Restore-Previous-Drawing-Preview.cmd --self-test
